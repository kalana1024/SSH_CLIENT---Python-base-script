[project]
name = "bh-sshcmd"
version = "2.0.0"
description = "A fully-loaded SSH command/fleet automation toolkit built on Paramiko"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paramiko>=3.4",
]

[project.optional-dependencies]
full = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.50",
]

[project.scripts]
bh-sshcmd = "bh_sshcmd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bh_sshcmd*"]
